name: Java CI
on:
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3 # Lấy code về

      - uses: actions/setup-java@v3 # Cài JDK
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: mvn package # Chạy lệnh build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: target/*.jar