name: Java CI
on:
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3 # Lấy code về

      - uses: actions/setup-java@v3 # Cài JDK
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Checkstyle Inline Reviewdog
        uses: dbelyaev/action-checkstyle@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: google_checks.xml
          reporter: github-pr-review
          level: error
          filter_mode: added
          fail_level: warning

      - run: mvn package # Chạy lệnh build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: target/*.jar